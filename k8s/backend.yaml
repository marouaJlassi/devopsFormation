apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: formationdevops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: maroua256/formation-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8285
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/devopsdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          startupProbe:
            httpGet:
              path: /SpringMVC/actuator/health
              port: 8282
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /SpringMVC/actuator/health
              port: 8282
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /SpringMVC/actuator/health
              port: 8282
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: formationdevops
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8285
      targetPort: 8285
      nodePort: 30085
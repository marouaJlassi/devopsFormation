global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: jenkins
    metrics_path: /prometheus
    basic_auth:
      username: admin
      password_file: /etc/prometheus/jenkins_token
    static_configs:
      - targets: ['172.17.0.1:8080']

  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
      - targets: ['172.17.0.1:8787']

  - job_name: backend
    metrics_path: /SpringMVC/actuator/prometheus
    static_configs:
      - targets: ['172.17.0.1:8285']
  - job_name: backend-k8s
    metrics_path: /SpringMVC/actuator/prometheus
    static_configs:
      - targets: ['192.168.49.2:30085']